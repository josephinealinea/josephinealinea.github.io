# Technologies shown in the "Technology I've Used" periodic table (_includes/sections/skills.md).
# One entry per category; add a technology by adding one line to `items`.
#   id    - matches a title under skills.categories in strings/en.yml
#   columns - optional; 2 makes the category span two columns of the table
#   icon  - emoji shown beside the category title
#   items - name (required), symbol (optional 1-2 letter tile label, defaults to
#           the first two letters of the name) and url (optional; https only,
#           opens in a new tab)

