# LATAM Trip 2026 — budget data.
# "display_currency" is the single currency the budget panel totals/charts
# are shown in. "exchange_rates" gives, for every other currency used below,
# how many units of that currency equal 1 unit of display_currency (e.g.
# `USD: 1.17` means 1 EUR = 1.17 USD) — these are hand-entered estimates for
# budgeting purposes, not live rates, so update them occasionally rather than
# expecting them to track the real market.
#
# Flat "items" list. "category" must exactly match a key in
# _data/budget_categories.yml (falls back to "other" if not). "currency" is
# an ISO 4217 code (e.g. "USD", "PEN") — every item's amount is converted to
# display_currency before totals/charts are computed. "countries" is a list
# (not a single value) because some items, especially flights, span more
# than one country — amount is split evenly across all listed countries when
# grouping "by country". "date" (YYYY-MM-DD) is optional and purely for your
# own record of when the expense was actually made — it isn't read by the
# budget panel or used for any grouping/display. "status" is optional and
# must be exactly "confirmed" or "pre-booked" (any item that omits it, or
# uses any other value, is treated as "confirmed"). The panel's default
# "Confirmed" view only charts confirmed items; the "Forecasted (All)" view
# includes both confirmed and pre-booked items.

