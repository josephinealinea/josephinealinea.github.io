# LATAM Trip 2026 — travel checklist data.
# Flat "items" list; "status" must be "todo" or "done" (lowercase) and must
# exactly match a key in _data/checklist_status_icons.yml.
# Rendered order is todo-first/done-last regardless of the order written here
# (see the sort logic in _layouts/travel.html) — write items in any order.
# Optional "options" — a list of { name, link } — turns the description into
# a clickable popup listing those options as a table (name links open in a
# new tab). No leading "-" inside the [ ] — it's a YAML flow sequence, not a
# block sequence.

trip_name: "LATAM Trip 2026"

