<!-- Avatar Chatbot -->
<button type="button" id="chatbot-icon" aria-label="Chat with {{ site.bot_name | escape }}" aria-expanded="false" aria-controls="chatbot-window">
  <img src="/assets/img/avatar.png" alt="">
</button>

<div id="chatbot-window">
<div id="chatbot-header">💬 ask {{ site.bot_name | escape }}</div>
<div id="chatbot-messages"></div>
  <input id="chatbot-input" type="text" placeholder="Type your message...">
</div>


<!-- Chatbot -->
<!-- <script src="//code.tidio.co/1zhyzmtbjaz2cakzamdxg9swquww11le.js" async></script> -->
<script>
const chatbotIcon = document.getElementById('chatbot-icon');
const chatbotWindow = document.getElementById('chatbot-window');
const chatbotMessages = document.getElementById('chatbot-messages');
const chatbotInput = document.getElementById('chatbot-input');
const chatbotHeader = document.getElementById('chatbot-header');

let botResponses = {
  "hi": "Hello! I'm {{ site.bot_name | escape }}. Ask me about {{ site.nickname | escape }}'s experience, skills, projects, or services.",
  "hello": "Hi! I'm {{ site.bot_name | escape }}. Ask me about {{ site.nickname | escape }}'s experience, skills, projects, or services.",
  "hey": "Hey! I'm {{ site.bot_name | escape }}. Ask me about {{ site.nickname | escape }}'s experience, skills, projects, or services.",
  "hola": "Hola! I'm {{ site.bot_name | escape }}. Ask me about {{ site.nickname | escape }}'s experience, skills, projects, or services.",
  "experience": "{{ site.nickname | escape }} is a versatile engineer who has cross-functional experience in FinTech, Banking, Telco, and iGaming. {{ site.nickname | escape }} builds website, web apps, APIs, name it.",
  "skill": "{{ site.nickname | escape }} is full stack but she mostly specializes in Java. She also has experience in Dev Operations. She can help with production-grade web development, API design, automation, and even support. Name it!",
  "project": "You can check {{ site.nickname | escape }}'s' portfolio section for details.",
  "service": "{{ site.nickname | escape }} can build you website, web apps, APIs, automation scripts, name it. She also provides support with technical coaching and mentoring. Please check About section and Contact to get in touch",
  "contact": "You can reach via contact form on this site or her LinkedIn.",
  "live": "{{ site.nickname | escape }} is currently based in Tallinn, Estonia.",
  "nationality": "{{ site.nickname | escape }} was born in Philippines and a Filipino citizen.",
  "zodiac": "{{ site.nickname | escape }}'s astronomical sign is Pisces, (the fish), a water sign. Let's get back to business.",
  "age": "Let's not talk about age :)",
  "old": "Let's not talk about age :)",
  "thank": "You're welcome!",
  "bye": "See you soon!"
};

function addMessage(sender, text) {
  let msg = document.createElement('div');
  msg.className = 'chatbot-message-collapsible';
  msg.innerHTML = `
    <div class="chatbot-message-header"><strong>${sender}:</strong></div>
    <div class="chatbot-message-body">${text}</div>
  `;
  msg.querySelector('.chatbot-message-header').addEventListener('click', function() {
    const body = msg.querySelector('.chatbot-message-body');
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
  });
  chatbotMessages.appendChild(msg);
  chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
}

chatbotIcon.addEventListener('click', () => {
  if (chatbotWindow.style.display === 'none' || chatbotWindow.style.display === '') {
    chatbotWindow.style.display = 'block';
    chatbotWindow.classList.add('collapsed');
  } else if (chatbotWindow.classList.contains('collapsed')) {
    chatbotWindow.classList.remove('collapsed');
  } else {
    chatbotWindow.style.display = 'none';
  }
  chatbotIcon.setAttribute('aria-expanded', chatbotWindow.style.display !== 'none');
});

let isDragging = false;
let dragOffset = { x: 0, y: 0 };
let clickTimeout;

/*chatbotHeader.addEventListener('click', () => {
  chatbotWindow.classList.toggle('collapsed');
});*/

chatbotHeader.addEventListener('mousedown', (e) => {
  clearTimeout(clickTimeout);

  const rect = chatbotWindow.getBoundingClientRect();
  dragOffset.x = e.clientX - rect.left;
  dragOffset.y = e.clientY - rect.top;

  isDragging = false;

  const handleMouseMove = (e) => {
    if (!isDragging) {
      isDragging = true;
      chatbotWindow.classList.add('dragging');
    }

    const newX = window.innerWidth - (e.clientX - dragOffset.x) - chatbotWindow.offsetWidth;
    const newY = window.innerHeight - (e.clientY - dragOffset.y) - chatbotWindow.offsetHeight;

    const boundedX = Math.max(0, Math.min(newX, window.innerWidth - chatbotWindow.offsetWidth));
    const boundedY = Math.max(0, Math.min(newY, window.innerHeight - chatbotWindow.offsetHeight));

    chatbotWindow.style.right = boundedX + 'px';
    chatbotWindow.style.bottom = boundedY + 'px';
  };

  const handleMouseUp = () => {
    document.removeEventListener('mousemove', handleMouseMove);
    document.removeEventListener('mouseup', handleMouseUp);

    if (isDragging) {
      isDragging = false;
      chatbotWindow.classList.remove('dragging');
    } else {
      clickTimeout = setTimeout(() => {
        chatbotWindow.classList.toggle('collapsed');
      }, 10);
    }
  };
  document.addEventListener('mousemove', handleMouseMove);
  document.addEventListener('mouseup', handleMouseUp);

  e.preventDefault(); // Prevent text selection
});

chatbotInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    let userMsg = chatbotInput.value.trim().toLowerCase();
    if (!userMsg) return;
    addMessage("You", chatbotInput.value);
    chatbotInput.value = "";

    let reply = "Sorry, I am still learning. Please ask something else or Contact via form to get in touch";
    for (let key in botResponses) {
      if (userMsg.includes(key)) {
        reply = botResponses[key];
        break;
      }
    }
    setTimeout(() => addMessage("{{ site.bot_name | escape }}", reply), 500);
  }
});

// Initial welcome message
// Never auto-open the title bar/header on load — the widget is fixed to a
// viewport corner, so an auto-opened header (~300px wide) has no way to
// know what page content it's about to land on top of. Leave just the
// avatar icon visible; the welcome message is queued up so it's there as
// soon as the visitor taps the icon themselves.
setTimeout(() => {
  addMessage("{{ site.bot_name | escape }}", "👋 Hi! I’m {{ site.bot_name | escape }}. Ask me {{ site.nickname | escape }}'s experiences, skills, projects, or services!");
}, 1000);

// The icon itself is still `position: fixed` to the corner of the
// viewport, which is what "floating" means here — that part is by design
// and stays. The problem was never that it floats; it's that a fixed
// corner has no idea what page content will end up underneath it. A
// hero card, an article paragraph, a itinerary card — any of them can
// happen to run right up against that corner, at any scroll position,
// on any page, and the icon (fully opaque) just sits on top and hides
// whatever's there.
//
// Rather than guess a fixed padding reservation per page/section (fragile
// — it only protects the one spot you happened to test), sample what's
// actually under the icon's rect and step the icon up just far enough to
// clear it. Runs on load and on resize only — i.e. it fixes the page's
// *resting* state, which is what people actually see first. It
// deliberately does NOT re-run on every scroll: on a long, continuous
// article the text column fills the full viewport height at almost any
// scroll position, so a "keep climbing until clear" loop has nowhere to
// converge and will walk the icon straight off the top of the screen —
// worse than the overlap it's trying to avoid. A floating widget briefly
// passing behind body text while someone is actively scrolling past it
// is normal (every chat-widget vendor does this); an icon that's already
// unreachable before anyone has scrolled is the actual bug being fixed.
const textNodeSelector = 'p, li, h1, h2, h3, h4, h5, dt, dd';
const mainContent = document.querySelector('main');

function findCollisionMinTop(iconRect) {
  // elementFromPoint() can't be used here — the icon is opaque and on
  // top, so a point sample at its own coordinates just returns the icon
  // itself, never what it's covering. Test real geometry instead: does
  // any text-bearing element's box actually intersect the icon's box?
  let minTop = Infinity;
  for (const el of mainContent.querySelectorAll(textNodeSelector)) {
    if (!el.textContent.trim()) continue;
    const r = el.getBoundingClientRect();
    const intersects = r.left < iconRect.right && r.right > iconRect.left &&
                        r.top < iconRect.bottom && r.bottom > iconRect.top;
    if (intersects && r.top < minTop) minTop = r.top;
  }
  return minTop;
}

function clearTextUnderIcon() {
  if (!mainContent) return;
  chatbotIcon.style.bottom = '';

  // Stepping the icon up can put it right into the next paragraph up
  // (short lines, tight leading), so re-check from its new position
  // rather than assuming one lift is enough. Converges in a couple of
  // passes in practice; capped so a pathological page can't loop forever.
  // Also hard-capped so the icon can never climb further than roughly the
  // upper third of the screen — beyond that it's no longer a believable
  // "floating corner" position anyway, and it must never leave the
  // viewport entirely.
  const iconHeight = chatbotIcon.getBoundingClientRect().height;
  const maxOffset = Math.round(window.innerHeight * 0.66 - iconHeight);
  let previousOffset = -1;
  for (let pass = 0; pass < 6; pass++) {
    const iconRect = chatbotIcon.getBoundingClientRect();
    const minTop = findCollisionMinTop(iconRect);
    if (minTop === Infinity) break;

    const bottomOffset = Math.min(maxOffset, Math.max(20, Math.round(window.innerHeight - minTop) + 16));
    if (bottomOffset === previousOffset) break;
    chatbotIcon.style.bottom = bottomOffset + 'px';
    previousOffset = bottomOffset;
  }
}

let clearTextTimer;
function scheduleClearTextCheck(delay) {
  clearTimeout(clearTextTimer);
  clearTextTimer = setTimeout(clearTextUnderIcon, delay);
}

window.addEventListener('load', () => scheduleClearTextCheck(50));
window.addEventListener('resize', () => scheduleClearTextCheck(150));
</script>
